[package]
name = "aperture"
version = "0.1.0"
description = "Universal LLM context visualization, management, and control proxy"
authors = ["Caden"]
edition = "2021"
default-run = "aperture"

[lib]
name = "aperture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server/client for proxy
axum = "0.8"
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
bytes = "1"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Token counting
tiktoken-rs = "0.6"

# Terminal (PTY)
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }

# Concurrent collections
dashmap = "6"

# Regex + lazy statics (metacog preview extraction)
regex = "1"
lazy_static = "1"

# Request body decompression (Codex CLI sends zstd-compressed bodies)
zstd = "0.13"

# Persistence
rusqlite = { version = "0.32", features = ["bundled"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment
dotenvy = "0.15"

# Unix process management (setsid for detached proxy spawning)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "aperture-mcp"
path = "src/bin/aperture_mcp.rs"

[[bin]]
name = "aperture-proxy"
path = "src/bin/aperture_proxy.rs"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
lto = true
opt-level = "z"
strip = true
